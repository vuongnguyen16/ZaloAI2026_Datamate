name: CPU gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
      - name: Save CPU evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-evidence
          path: |
            runs/cpu-check-*/gate.json
            runs/cpu-check-*/ruff_check.log
            runs/cpu-check-*/ruff_format.log
            runs/cpu-check-*/pytest.log
          if-no-files-found: warn
          retention-days: 7
